<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - clpr</title>
    <meta name="theme-color" content="#0e0c13" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0e0c13;
        color: #eeedf7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }
      .container {
        max-width: 500px;
        width: 100%;
        background: #17141f;
        border: 1px solid #3b3548;
        box-shadow: inset 0 3px 0 #8c5cff;
        padding: 40px;
      }
      .icon {
        display: block;
        width: 48px;
        height: 48px;
        margin: 0 auto 24px;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      p { font-size: 16px; line-height: 1.6; margin-bottom: 24px; color: #aca7bb; }
      .button {
        display: inline-block;
        padding: 12px 28px;
        background: #a07cff;
        color: #0e0c13;
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
        border: none;
        font-size: 15px;
      }
      .button:hover { background: #b79bff; }
      .button:focus-visible { outline: 2px solid #b79bff; outline-offset: 2px; }
      .status {
        margin-top: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8f8a9c;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <svg class="icon" viewBox="300 118 120 120" aria-hidden="true">
        <path fill="#291D47" d="M 337.95179,84.337349 C 337.83702,98.913704 235.23716,157.07747 222.67106,149.68989 210.10495,142.30232 211.03358,24.366357 223.71446,17.177577 236.39534,9.9887976 338.06657,69.760995 337.95179,84.337349 Z" transform="matrix(0.79700388,-0.00938331,0.00685343,0.72799935,141.58688,114.8691)" />
        <path fill="#8C5CFF" d="M 337.95179,84.337349 C 337.83702,98.913704 235.23716,157.07747 222.67106,149.68989 210.10495,142.30232 211.03358,24.366357 223.71446,17.177577 236.39534,9.9887976 338.06657,69.760995 337.95179,84.337349 Z" transform="matrix(0.52212612,-0.00614711,0.00448976,0.4769205,214.29286,134.96388)" />
      </svg>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry, we've
        saved the app shell so you can still see the basic interface.
      </p>
      <p>
        To view clips and interact with the community, you'll need to reconnect
        to the internet.
      </p>
      <button class="button" onclick="window.location.reload()">
        Try Again
      </button>
      <div class="status" id="status">Checking connection...</div>
    </div>

    <script>
      // Check if we're back online
      function updateOnlineStatus() {
        const status = document.getElementById('status');
        if (navigator.onLine) {
          status.textContent = "You're back online! Tap 'Try Again' to reload.";
          status.style.color = '#3ddc97';
        } else {
          status.textContent = 'Still offline. Waiting for connection...';
          status.style.color = '#ffc24a';
        }
      }

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);

      // Initial status check
      updateOnlineStatus();

      // Periodic check
      setInterval(updateOnlineStatus, 3000);
    </script>
  </body>
</html>
